<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Cart</title>

    <link rel="stylesheet" href="/css/style.css" />

    <script src="../js/cart.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="cart-section">
        <h2>My Cart</h2>

        <ul class="product-list"></ul>

        <!-- Cart summary footer – must exist for totals to show -->
        <div class="cart-footer hide">
          <div class="cart-summary">
            <p>
              <strong>Subtotal:</strong> <span class="cart-total">$0.00</span>
            </p>

            <!-- You can add shipping/tax later if needed -->
          </div>

          <a href="../checkout/index.html" class="button checkout-btn"
            >Proceed to Checkout</a
          >
        </div>

        <!-- Optional empty state message (will be replaced by JS if needed) -->

        <p class="empty-cart-message hide">
          Your cart is empty. <a href="../index.html">Continue shopping</a>
        </p>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
