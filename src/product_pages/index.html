<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Product Details</title>
    <!--script will dynamically change the title -->

    <link rel="stylesheet" href="../css/style.css" />

    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="product-detail">
        <h3 id="p-brand"></h3>
        <!-- Brand -->

        <h2 class="product__category" id="p-name"></h2>

        <img id="p-image" class="divider" src="" alt="" />
        <!-- Image -->

        <p id="p-price" class="product-card__price"></p>
        <!-- Price -->

        <p id="p-color" class="product__color"></p>
        <!-- Color -->

        <p id="p-description" class="product__description"></p>
        <!-- Description -->

        <div class="product-detail__add">
          <button id="add-to-cart" data-id="">Add to Cart</button>
          <!-- JS sets data-id -->
        </div>
      </section>
    </main>

    <footer id="main-footer">&copy;NOT a real business</footer>
  </body>
</html>
